services:
  devbox:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Bump in the Portainer stack env + redeploy with rebuild to force
        # fresh CLI installs (layer cache otherwise pins the old versions).
        - CLI_REFRESH=${CLI_REFRESH:-0}
        # Selects .devcontainer/customers/<CUSTOMER>.sh at build time (default
        # base = no-op). Set per stack in Portainer for customers needing extra
        # tooling, e.g. CUSTOMER=d2 installs the 1Password CLI. Rebuild required.
        - CUSTOMER=${CUSTOMER:-base}
    container_name: ${INSTANCE:-devbox}
    hostname: ${INSTANCE:-devbox}
    volumes:
      - workspace:/workspace                 # per-stack named volume; clone the customer repo inside the container
      - home:/home/dev                       # everything per-tool lives under here: claude/codex/gh logins, code-server + vscode-server state, ~/.ssh, ~/.gitconfig, shell history. One volume so new tools persist without a compose change.
      - sshhostkeys:/etc/ssh/keys           # SSH *host* identity — lives outside /home/dev (sshd -h points here); persisted so it's stable across recreations
    working_dir: /workspace
    environment:
      # Claude/Codex/gh authenticate via interactive login, persisted per-stack
      # in the `home` volume — no API keys.
      # NOTE: vars set here land on PID 1 only — sshd login shells and the
      # sudo'd code-server do NOT inherit them. Anything users need at a shell
      # (DEV_PORT, and CLAUDE_CONFIG_DIR for Claude login persistence) is
      # re-exported by the entrypoint via /etc/profile.d + the code-server exec.
      - SSH_PUBKEY=${SSH_PUBKEY:-}
      - SSH_PUBKEY2=${SSH_PUBKEY2:-}
      - DEV_PORT=${DEV_PORT:-8081}
    ports:
      - "${SSH_PORT:-2222}:22"
      - "${CODE_PORT:-8443}:8443"
      - "${DEV_PORT:-8081}:${DEV_PORT:-8081}"   # app dev server; reachable at solstice.local:${DEV_PORT}
    restart: unless-stopped
    command: ["/usr/local/bin/entrypoint.sh"]

volumes:
  workspace:
  home:
  sshhostkeys:
