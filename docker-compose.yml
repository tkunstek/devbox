services:
  devbox:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${INSTANCE:-devbox}
    hostname: ${INSTANCE:-devbox}
    volumes:
      - workspace:/workspace                 # per-stack named volume; clone the customer repo inside the container
      - claude-config:/home/dev/.claude
      - codex-config:/home/dev/.codex
      - codeserver-config:/home/dev/.config/code-server
      - vscode-server:/home/dev/.vscode-server
      - sshkeys:/home/dev/.ssh
      - sshhostkeys:/etc/ssh/keys           # persist host keys so SSH identity is stable across recreations
    working_dir: /workspace
    environment:
      # Claude/Codex authenticate via your subscriptions (interactive login),
      # persisted per-stack in claude-config / codex-config — no API keys.
      # CLAUDE_CONFIG_DIR points Claude Code at the persisted claude-config
      # volume for BOTH its credentials AND its account/onboarding state. By
      # default the OAuth tokens land in ~/.claude/.credentials.json (inside the
      # volume, fine) but the account identity lands in ~/.claude.json at the
      # home root, which is NOT a volume — so it was wiped on every container
      # recreation and forced a re-login. Setting this writes .claude.json into
      # /home/dev/.claude too, so the login survives recreations.
      - CLAUDE_CONFIG_DIR=/home/dev/.claude
      - SSH_PUBKEY=${SSH_PUBKEY:-}
      - DEV_PORT=${DEV_PORT:-8081}
    ports:
      - "${SSH_PORT:-2222}:22"
      - "${CODE_PORT:-8443}:8443"
      - "${DEV_PORT:-8081}:${DEV_PORT:-8081}"   # app dev server; reachable at solstice.local:${DEV_PORT}
    restart: unless-stopped
    command: ["/usr/local/bin/entrypoint.sh"]

volumes:
  workspace:
  claude-config:
  codex-config:
  codeserver-config:
  vscode-server:
  sshkeys:
  sshhostkeys:
