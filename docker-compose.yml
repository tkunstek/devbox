services:
  devbox:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${INSTANCE:-devbox}
    hostname: ${INSTANCE:-devbox}
    volumes:
      - workspace:/workspace                 # per-stack named volume; clone the customer repo inside the container
      - claude-config:/home/dev/.claude
      - codex-config:/home/dev/.codex
      - gh-config:/home/dev/.config/gh         # gh stores its token in ~/.config/gh/hosts.yml (no keyring in-container); persist so login survives recreation
      - codeserver-config:/home/dev/.config/code-server
      - vscode-server:/home/dev/.vscode-server
      - sshkeys:/home/dev/.ssh
      - sshhostkeys:/etc/ssh/keys           # persist host keys so SSH identity is stable across recreations
    working_dir: /workspace
    environment:
      # Claude/Codex authenticate via your subscriptions (interactive login),
      # persisted per-stack in claude-config / codex-config — no API keys.
      # NOTE: vars set here land on PID 1 only — sshd login shells and the
      # sudo'd code-server do NOT inherit them. Anything users need at a shell
      # (DEV_PORT, and CLAUDE_CONFIG_DIR for Claude login persistence) is
      # re-exported by the entrypoint via /etc/profile.d + the code-server exec.
      - SSH_PUBKEY=${SSH_PUBKEY:-}
      - DEV_PORT=${DEV_PORT:-8081}
    ports:
      - "${SSH_PORT:-2222}:22"
      - "${CODE_PORT:-8443}:8443"
      - "${DEV_PORT:-8081}:${DEV_PORT:-8081}"   # app dev server; reachable at solstice.local:${DEV_PORT}
    restart: unless-stopped
    command: ["/usr/local/bin/entrypoint.sh"]

volumes:
  workspace:
  claude-config:
  codex-config:
  gh-config:
  codeserver-config:
  vscode-server:
  sshkeys:
  sshhostkeys:
