services:
  devbox:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devbox
    hostname: devbox
    volumes:
      - /opt/devbox:/workspace:cached      # your real code clone, NOT in this repo
      - devbox-node-modules:/workspace/node_modules
      - claude-config:/home/dev/.claude
      - codex-config:/home/dev/.codex
      - codeserver-config:/home/dev/.config/code-server
      - vscode-server:/home/dev/.vscode-server
      - sshkeys:/home/dev/.ssh
    working_dir: /workspace
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - "2222:22"
      - "8443:8443"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: ["/usr/local/bin/entrypoint.sh"]

volumes:
  devbox-node-modules:
  claude-config:
  codex-config:
  codeserver-config:
  vscode-server:
  sshkeys:
