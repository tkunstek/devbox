services:
  devbox:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${INSTANCE:-devbox}
    hostname: ${INSTANCE:-devbox}
    volumes:
      - workspace:/workspace                 # per-stack named volume; clone the customer repo inside the container
      - claude-config:/home/dev/.claude
      - codex-config:/home/dev/.codex
      - codeserver-config:/home/dev/.config/code-server
      - vscode-server:/home/dev/.vscode-server
      - sshkeys:/home/dev/.ssh
      - sshhostkeys:/etc/ssh/keys           # persist host keys so SSH identity is stable across recreations
    working_dir: /workspace
    environment:
      # Claude/Codex authenticate via your subscriptions (interactive login),
      # persisted per-stack in claude-config / codex-config — no API keys.
      - SSH_PUBKEY=${SSH_PUBKEY:-}
    ports:
      - "${SSH_PORT:-2222}:22"
      - "${CODE_PORT:-8443}:8443"
    restart: unless-stopped
    command: ["/usr/local/bin/entrypoint.sh"]

volumes:
  workspace:
  claude-config:
  codex-config:
  codeserver-config:
  vscode-server:
  sshkeys:
  sshhostkeys:
